name: Tests

# Test on all pushes, except when the push is literally just a tag (because we
# tag automatically via CI, and therefore there's no extra code in that push).
on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:


jobs:
  tests:
    env:
      ENV_NAME: tests
      PYTHON: ${{ matrix.python-version }}
      OS: ${{ matrix.os }}
    name: Testing
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]  # macos-latest doesn't work for polychord yet...
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: gcc
          version: 13
      - name: Install numpy
        run: |
          python -m pip install numpy scipy setuptools
      - name: Setup polychord
        run: |
          git clone https://github.com/PolyChord/PolyChordLite
          cd PolyChordLite
          python setup.py --no-mpi install
          cd ..
      - name: Setup Environment
        run: |
          pip install -U coverage
          pip install . --group dev
      - name: Run Tests
        run: |
          python -m pytest --cov-report xml:./coverage.xml
      - name: Coverage of the v3 core
        # The generic v3 layer must stay at least 90% covered; the v2 modules are
        # outside this gate.
        run: |
          python -m coverage report --fail-under=90 --include="*/yabf/params.py,*/yabf/priors.py,*/yabf/stages.py,*/yabf/pipeline.py,*/yabf/posterior.py,*/yabf/likelihoods.py,*/yabf/testing.py,*/yabf/sampling.py,*/yabf/_nautilus.py"
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: true
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  mpi:
    # The CosmoSIS driver under MPI: a run killed and resumed, and a failing first
    # rank ending the job. The other jobs run the serial CosmoSIS tests.
    name: CosmoSIS under MPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13
      - name: Install MPI
        run: sudo apt-get update && sudo apt-get install -y openmpi-bin libopenmpi-dev
      - name: Install
        env:
          MPIFC: mpif90
        run: pip install ".[cosmosis]" --group tests
      - name: Run the CosmoSIS tests
        run: python -m pytest tests/test_cosmosis.py --no-cov -v
