name: Labeler

on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.yml'
      - '.github/workflows/labeler.yml'
  pull_request:
    paths:
      - '.github/labels.yml'
      - '.github/workflows/labeler.yml'
  # Manual re-sync, e.g. after a run was interrupted part-way.
  workflow_dispatch:

# Queue runs per ref so an older config can never be applied after a newer one.
concurrency:
  group: labeler-${{ github.ref }}
  cancel-in-progress: false

jobs:
  labeler:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run Labeler
        uses: crazy-max/ghaction-github-labeler@v6.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels.yml
          # Only create/update the labels listed in labels.yml; never delete others.
          skip-delete: true
          # On PRs, report what would change without touching the repo's labels.
          dry-run: ${{ github.event_name == 'pull_request' }}
