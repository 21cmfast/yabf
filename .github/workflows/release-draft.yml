name: Update Draft Release

# Draft releases for main only. A push to any other branch (v2.x, feature branches)
# would otherwise retarget main's draft. v2.x patch releases are drafted by hand.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    name: Update Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
