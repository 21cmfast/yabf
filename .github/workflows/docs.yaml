name: Docs

# Build the documentation, running every tutorial, so that a change that breaks one
# fails here rather than on Read the Docs.
on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: fortran-lang/setup-fortran@v1
        with:
          compiler: gcc
          version: 13
      - name: Install LAPACK
        # CosmoSIS builds MultiNest, which links to LAPACK.
        run: sudo apt-get update && sudo apt-get install -y liblapack-dev
      - name: Install
        run: pip install . --group docs
      - name: Build
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
